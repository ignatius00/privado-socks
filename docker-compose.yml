version: '3.8'

services:
  privado-socks:
    build: .
    container_name: privado-socks
    restart: unless-stopped
    # NET_ADMIN + /dev/net/tun required for VPN tunnel
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # Bind SOCKS5 to localhost only (secure)
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      - PRIVADO_USERNAME=${PRIVADO_USERNAME}
      - PRIVADO_PASSWORD=${PRIVADO_PASSWORD}
      - PRIVADO_CMD=${PRIVADO_CMD:-privado connect --auto}
    # Optional: limit resources
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M